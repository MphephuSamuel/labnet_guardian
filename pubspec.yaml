name: labnet_guardian
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

  # PDF SYSTEM
  pdf: ^3.11.0
  printing: ^5.12.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  share_plus: ^7.2.1  # Use share_plus instead of open_file
  
  # NETWORK / BACKEND
  http: ^1.2.2
  socket_io_client: ^3.0.2

  # FIREBASE
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.8

  # ENV
  flutter_dotenv: ^5.1.0

  # CHARTS
  fl_chart: ^0.68.0

  # SECURITY
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # UTILITIES
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
  
# Remove any dependency_overrides section